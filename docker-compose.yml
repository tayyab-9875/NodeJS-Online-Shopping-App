services:
  app:
    build:
      context: .
    ports:
      - "3000:3000"
    environment:
      MONGO_URI: mongodb://mongo:27017/norder
      PORT: 3000
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - uploads:/app/images

  mongo:
    image: mongo:4.4
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  uploads:
